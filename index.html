<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pdftool — combine, reorder and rotate PDF pages</title>
  <meta name="description" content="Merge PDFs, pick and reorder pages, rotate and delete them. Runs entirely in your browser; files never leave your device.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='3' width='17' height='22' rx='2' fill='%23f3b9aa'/%3E%3Crect x='5' y='7' width='17' height='22' rx='2' fill='%23d9482b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" hidden>
  <defs>
    <g id="i-rot-r" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4v6h-6"/><path d="M20 10a8 8 0 1 0 .6 5"/></g>
    <g id="i-rot-l" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"/><path d="M4 10a8 8 0 1 1-.6 5"/></g>
    <g id="i-trash" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></g>
    <g id="i-copy" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></g>
    <g id="i-zoom" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5M11 8.5v5M8.5 11h5"/></g>
    <g id="i-undo" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></g>
    <g id="i-redo" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></g>
    <g id="i-plus" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></g>
    <g id="i-down" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></g>
    <g id="i-x" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></g>
    <g id="i-left" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></g>
    <g id="i-right" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></g>
  </defs>
</svg>

<header class="bar">
  <div class="row row-main">
    <a class="brand" href="./" aria-label="pdftool">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="9" y="3" width="17" height="22" rx="2" fill="var(--accent-soft)"/><rect x="5" y="7" width="17" height="22" rx="2" fill="var(--accent)"/></svg>
      <span>pdftool</span>
    </a>
    <button class="btn" id="add" type="button"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Add files</button>
    <div class="group needs-pages">
      <button class="btn icon" id="undo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><use href="#i-undo"/></svg></button>
      <button class="btn icon" id="redo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><use href="#i-redo"/></svg></button>
    </div>
    <span class="spacer"></span>
    <button class="btn ghost needs-pages" id="reset" type="button">Start over</button>
    <div class="group export needs-pages">
      <input id="outname" type="text" spellcheck="false" autocomplete="off" aria-label="Output file name" value="combined.pdf">
      <button class="btn primary" id="download" type="button" title="Download all pages as one PDF (Ctrl+S)"><svg viewBox="0 0 24 24"><use href="#i-down"/></svg>Download PDF</button>
    </div>
  </div>

  <div class="row row-sel needs-pages">
    <span id="count" class="count" aria-live="polite"></span>
    <div class="group">
      <button class="btn small" id="sel-all" type="button" title="Select all (Ctrl+A)">All</button>
      <button class="btn small" id="sel-none" type="button" title="Clear selection (Esc)">None</button>
      <button class="btn small" id="sel-invert" type="button">Invert</button>
    </div>
    <div class="group needs-sel">
      <button class="btn small" id="rot-l" type="button" title="Rotate left (Shift+R)"><svg viewBox="0 0 24 24"><use href="#i-rot-l"/></svg>Left</button>
      <button class="btn small" id="rot-r" type="button" title="Rotate right (R)"><svg viewBox="0 0 24 24"><use href="#i-rot-r"/></svg>Right</button>
      <button class="btn small" id="dup" type="button" title="Duplicate (D)"><svg viewBox="0 0 24 24"><use href="#i-copy"/></svg>Duplicate</button>
      <button class="btn small danger" id="del" type="button" title="Delete (Del)"><svg viewBox="0 0 24 24"><use href="#i-trash"/></svg>Delete</button>
      <button class="btn small" id="download-sel" type="button" title="Download only the selected pages"><svg viewBox="0 0 24 24"><use href="#i-down"/></svg>Download selection</button>
    </div>
    <span class="spacer"></span>
    <label class="size" title="Thumbnail size">
      <svg viewBox="0 0 24 24" width="14" height="14"><use href="#i-zoom"/></svg>
      <input id="size" type="range" min="110" max="320" step="10" value="170" aria-label="Thumbnail size">
    </label>
  </div>

  <div class="row row-files needs-pages" id="files" aria-label="Source files"></div>
</header>

<main id="main">
  <section id="empty" class="empty">
    <button id="dropzone" class="dropzone" type="button">
      <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
        <rect x="22" y="6" width="30" height="40" rx="3" fill="var(--accent-soft)"/>
        <rect x="12" y="16" width="30" height="40" rx="3" fill="var(--accent)"/>
        <path d="M27 36v-10M22 30l5-5 5 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 8)"/>
      </svg>
      <strong>Drop PDFs here, or click to choose</strong>
      <span>Combine several files, pick the pages you want, drag them into order, rotate, delete — then download one PDF. Images (JPG, PNG) work too.</span>
    </button>
    <p class="privacy">Everything happens in your browser. Your files are never uploaded anywhere.</p>
  </section>

  <div id="grid" class="grid" hidden></div>
  <p id="hint" class="hint" hidden>Click a page to select it (Shift+click for a range) · drag to reorder · double-click to preview · drop more files anywhere to add them</p>
</main>

<input id="picker" type="file" accept="application/pdf,.pdf,image/*" multiple hidden>

<div id="dropveil" class="dropveil" hidden><div>Drop to add pages</div></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<dialog id="preview" class="preview">
  <header>
    <span id="pv-title"></span>
    <span class="spacer"></span>
    <button class="btn icon" id="pv-rot-l" type="button" title="Rotate left" aria-label="Rotate left"><svg viewBox="0 0 24 24"><use href="#i-rot-l"/></svg></button>
    <button class="btn icon" id="pv-rot-r" type="button" title="Rotate right" aria-label="Rotate right"><svg viewBox="0 0 24 24"><use href="#i-rot-r"/></svg></button>
    <button class="btn icon" id="pv-close" type="button" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
  </header>
  <div class="pv-body">
    <button class="btn icon pv-nav" id="pv-prev" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24"><use href="#i-left"/></svg></button>
    <div class="pv-stage" id="pv-stage"></div>
    <button class="btn icon pv-nav" id="pv-next" type="button" aria-label="Next page"><svg viewBox="0 0 24 24"><use href="#i-right"/></svg></button>
  </div>
</dialog>

<script type="module" src="js/app.js"></script>
<noscript><p style="padding:2rem;text-align:center">pdftool needs JavaScript — all PDF processing happens locally in your browser.</p></noscript>
</body>
</html>
